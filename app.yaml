runtime: nodejs20
service: nabilanl2311522023

handlers:
  - url: /
    static_files: out/index.html
    upload: out/index.html

  - url: /(.*)
    static_files: out/\1
    upload: out/(.*)

automatic_scaling:
  min_instances: 1
  max_instances: 10
  min_idle_instances: 1
  max_idle_instances: 2
  min_pending_latency: 30ms
  max_pending_latency: automatic
  max_concurrent_requests: 50